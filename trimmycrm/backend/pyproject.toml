[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "trimmycrm-backend"
version = "1.0.0"
description = "Multi-tenant TrimmyCRM SaaS backend"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "dnspython>=2.7,<3",
  "email-validator>=2.2,<3",
  "fastapi>=0.140.13,<0.141",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "prometheus-fastapi-instrumentator>=8.1,<9",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis[hiredis]>=5.2,<7",
  "sentry-sdk[fastapi]>=2.20,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "starlette>=1.3.1,<2",
  "structlog>=24.4,<26",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "faker>=33,<40",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "testcontainers[postgres,redis]>=4.9,<5",
  "types-openpyxl>=3.1,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"
markers = [
  "integration: requires explicitly configured external services",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["B008", "S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true
warn_unused_ignores = true
